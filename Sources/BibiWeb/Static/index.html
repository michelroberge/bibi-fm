<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bibi</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='h' cx='.35' cy='.3' r='.75'%3E%3Cstop offset='0' stop-color='%23a9a9f0'/%3E%3Cstop offset='.5' stop-color='%235b5bd6'/%3E%3Cstop offset='1' stop-color='%23292966'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='17' r='14' fill='url(%23h)'/%3E%3Ccircle cx='10.5' cy='15' r='3.6' fill='%23120f2a'/%3E%3Ccircle cx='21.5' cy='15' r='3.6' fill='%23120f2a'/%3E%3Ccircle cx='10.5' cy='15' r='2.6' fill='%23ffe9a0'/%3E%3Ccircle cx='21.5' cy='15' r='2.6' fill='%23ffe9a0'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><canvas class="logo" aria-hidden="true"></canvas>bibi</a>
    <nav>
      <a href="#/chat" data-nav="chat">Chat</a>
      <a href="#/run" data-nav="home">Run</a>
      <a href="#/history" data-nav="history">History</a>
      <a href="#/diff" data-nav="diff">Changes</a>
      <a href="#/skills" data-nav="skills">Skills</a>
    </nav>
    <span class="seg theme" role="group" aria-label="Theme">
      <button data-theme-choice="auto" title="Follow the device setting">Auto</button>
      <button data-theme-choice="light">Light</button>
      <button data-theme-choice="dark">Dark</button>
    </span>
    <span class="muted small" id="version"></span>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="bar" class="actionbar" hidden></div>
  <dialog id="confirm">
    <form method="dialog">
      <h3 id="confirm-title"></h3>
      <div id="confirm-body"></div>
      <menu>
        <button value="cancel" class="secondary">Cancel</button>
        <button value="ok" id="confirm-ok" class="primary">Continue</button>
      </menu>
    </form>
  </dialog>
  <script src="/chat.js"></script>
  <script src="/app.js"></script>
</body>
</html>
