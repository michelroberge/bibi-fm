# CodeQL code scanning (advanced setup; default setup must stay off, GitHub rejects uploads while both are on).
# Swift needs a real build with the macOS 26 SDK and Swift 6.2, so it runs on macos-26 like ci.yml; the other
# languages need no build and run on Linux.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        if: matrix.language == 'swift'
        uses: actions/cache@v4
        with:
          path: .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.build-mode == 'manual'
        run: swift build

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
